<div class="app-atmosphere" aria-hidden="true">
  <span class="ambient-shape ambient-shape--one"></span>
  <span class="ambient-shape ambient-shape--two"></span>
  <span class="ambient-shape ambient-shape--three"></span>
</div>
<app-navbar></app-navbar>

<!-- Toast Container -->
<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  <div *ngFor="let toast of toastService.toasts()"
       [@toastAnimation]
       class="pointer-events-auto flex items-center justify-between gap-3 rounded-2xl border px-4 py-3 shadow-2xl backdrop-blur-xl"
       [ngClass]="{
         'bg-[#7ae0c3]/15 border-[#7ae0c3]/30 text-[#baf4e3]': toast.type === 'success',
         'bg-[#ff8d70]/15 border-[#ff8d70]/30 text-[#ffb4a1]': toast.type === 'error',
         'bg-[#ffc96b]/15 border-[#ffc96b]/30 text-[#ffd996]': toast.type === 'warning',
         'bg-[#8cbcff]/15 border-[#8cbcff]/30 text-[#9fc5ff]': toast.type === 'info'
       }">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-lg"
            [ngClass]="{
              'text-[#7ae0c3]': toast.type === 'success',
              'text-[#ff8d70]': toast.type === 'error',
              'text-[#ffc96b]': toast.type === 'warning',
              'text-[#8cbcff]': toast.type === 'info'
            }">
        {{ toast.type === 'success' ? 'check_circle' : toast.type === 'error' ? 'error' : toast.type === 'warning' ? 'warning' : 'info' }}
      </span>
      <span class="text-sm font-medium leading-relaxed">{{ toast.message }}</span>
    </div>
    <button (click)="toastService.dismiss(toast.id)" class="text-white/40 hover:text-white border-0 bg-transparent cursor-pointer p-1 rounded-full flex items-center">
      <span class="material-symbols-outlined text-base">close</span>
    </button>
  </div>
</div>

<!-- Custom Confirmation Modal -->
<div *ngIf="confirmService.isOpen()"
     [@overlayFade]
     class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
  <div [@modalFadeScale]
       class="glass-panel max-w-sm w-full rounded-[30px] border border-white/10 p-6 shadow-2xl relative">
    <h3 class="text-xl font-bold text-white mb-2 font-headline">
      {{ confirmService.config()?.title }}
    </h3>
    <p class="text-sm text-[#8ea5b0] mb-6 leading-relaxed">
      {{ confirmService.config()?.message }}
    </p>
    <div class="flex justify-end gap-3">
      <button (click)="confirmService.resolve(false)"
              class="px-5 py-2 rounded-full border border-white/10 bg-white/5 text-xs font-semibold text-[#b2c2ca] hover:bg-white/10 transition-all cursor-pointer">
        {{ confirmService.config()?.cancelText || 'Cancel' }}
      </button>
      <button (click)="confirmService.resolve(true)"
              [ngClass]="{
                'bg-[#ff8d70] hover:bg-[#ff9f87] text-[#051721]': confirmService.config()?.type === 'danger',
                'bg-[#ffc96b] hover:bg-[#ffd996] text-[#051721]': confirmService.config()?.type === 'warning',
                'bg-[#7ae0c3] hover:bg-[#86ebd2] text-[#05201f]': confirmService.config()?.type === 'info'
              }"
              class="px-6 py-2 rounded-full text-xs font-bold shadow-md transition-all cursor-pointer">
        {{ confirmService.config()?.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
